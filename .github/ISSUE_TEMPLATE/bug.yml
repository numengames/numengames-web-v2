name: 🐛 Bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué ocurre
      description: Pasos para reproducir + comportamiento esperado.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador / dispositivo
  - type: dropdown
    id: capa
    attributes:
      label: Capa afectada
      options: [Narrativa (home), Páginas operativas, Gamificación, i18n, A11y, Build/CI]
